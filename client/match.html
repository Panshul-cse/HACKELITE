<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Matches - DevMatch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/dashboard.html" class="logo">DevMatch</a>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/match.html" class="active">Find Matches</a></li>
                <li><a href="/team.html">My Teams</a></li>
                <li><button id="logoutBtn" class="btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="match-container">
        <aside class="filter-sidebar">
            <h3>Filter Developers</h3>
            <div class="filter-group">
                <label for="skillFilter">Skills</label>
                <input type="text" id="skillFilter" placeholder="JavaScript, React...">
            </div>
            <div class="filter-group">
                <label for="experienceFilter">Experience Level</label>
                <select id="experienceFilter">
                    <option value="">All Levels</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="expert">Expert</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="locationFilter">Location</label>
                <input type="text" id="locationFilter" placeholder="City or Country">
            </div>
            <button id="applyFilters" class="btn btn-primary btn-full">Apply Filters</button>
            <button id="resetFilters" class="btn btn-secondary btn-full">Reset</button>
        </aside>

        <main class="match-results">
            <div class="results-header">
                <h2>Available Developers</h2>
                <p id="resultsCount">0 developers found</p>
            </div>

            <div id="matchesList" class="matches-grid">
                <p class="loading">Loading developers...</p>
            </div>
        </main>
    </div>

    <div id="matchModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalBody" class="modal-body">
                <!-- Developer details will be loaded here -->
            </div>
            <div class="modal-actions">
                <button id="sendRequestBtn" class="btn btn-primary">Send Match Request</button>
                <button id="skipBtn" class="btn btn-secondary">Skip</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/match.js"></script>
</body>
</html>
