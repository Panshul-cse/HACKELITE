<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Teams - DevMatch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/dashboard.html" class="logo">DevMatch</a>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/match.html">Find Matches</a></li>
                <li><a href="/team.html" class="active">My Teams</a></li>
                <li><button id="logoutBtn" class="btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="team-container">
        <div class="team-header">
            <h1>My Teams</h1>
            <button id="createTeamBtn" class="btn btn-primary">+ Create New Team</button>
        </div>

        <div class="teams-grid" id="teamsList">
            <p class="loading">Loading teams...</p>
        </div>
    </div>

    <div id="teamModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-modal">&times;</span>
            <form id="teamForm" class="team-form">
                <h2 id="modalTitle">Create Team</h2>
                
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input type="text" id="teamName" name="teamName" required placeholder="My Awesome Team">
                </div>

                <div class="form-group">
                    <label for="teamDescription">Description</label>
                    <textarea id="teamDescription" name="teamDescription" rows="4" placeholder="Describe your team's goals and focus areas..."></textarea>
                </div>

                <div class="form-group">
                    <label for="teamRole">Your Role in Team</label>
                    <input type="text" id="teamRole" name="teamRole" placeholder="e.g., Team Lead, Backend Developer">
                </div>

                <div class="form-group">
                    <label for="requiredSkills">Required Skills</label>
                    <input type="text" id="requiredSkills" name="requiredSkills" placeholder="JavaScript, React, Node.js">
                </div>

                <div class="form-group">
                    <label for="teamSize">Target Team Size</label>
                    <input type="number" id="teamSize" name="teamSize" min="1" max="20" placeholder="5">
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save Team</button>
                    <button type="button" class="btn btn-secondary close-modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="teamDetailModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-modal">&times;</span>
            <div id="teamDetailContent" class="team-detail">
                <!-- Team details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/team.js"></script>
</body>
</html>
